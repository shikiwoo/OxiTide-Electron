name: AppImage (Electron)

# Builds the Electron flavour as an AppImage (electron/package.sh).
# - push to main / manual run: the AppImage is a workflow artifact (14 days).
# - tag electron-v<version> (e.g. electron-v1.1.8-1): also a GitHub Release
#   with the AppImage, the signed Windows installer (windows.yml), the macOS
#   .dmg (macos.yml), latest.json for the Windows updater and SHA256SUMS.txt.
#   The tag's version must match the workspace Cargo.toml.
# Upstream's own workflows (ci, release, audit, pages) are disabled in this
# repository; release.yml listens to `v*` tags, which this fork doesn't use.

on:
  push:
    branches: [main]
    tags: ["electron-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  appimage:
    # The oldest base upstream builds on: glibc 2.35, webkit2gtk 4.1.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libasound2-plugins libdbus-1-dev \
            patchelf

      - name: Read the pinned toolchain
        id: rust
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)".*/\1/p' rust-toolchain.toml | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            electron/package-lock.json

      - name: Version
        id: version
        run: |
          cargo_version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF" == refs/tags/electron-v* ]]; then
            version="${GITHUB_REF_NAME#electron-v}"
          else
            version="${cargo_version}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Build the AppImage
        run: ./electron/package.sh "${{ steps.version.outputs.version }}"

      - name: Checksum
        working-directory: electron/out/dist
        run: sha256sum *.AppImage | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: OxiTide-Electron-${{ steps.version.outputs.version }}
          path: |
            electron/out/dist/*.AppImage
            electron/out/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  # A release also carries the Windows installer (signed for the updater) and
  # the macOS disk image, built by their own workflows.
  windows:
    if: startsWith(github.ref, 'refs/tags/electron-v')
    uses: ./.github/workflows/windows.yml
    secrets: inherit

  macos:
    if: startsWith(github.ref, 'refs/tags/electron-v')
    uses: ./.github/workflows/macos.yml

  release:
    if: startsWith(github.ref, 'refs/tags/electron-v')
    needs: [appimage, windows, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # latest.json is what installed Windows copies read (the updater
      # endpoint in tauri.conf.json); SHA256SUMS.txt covers every installer.
      - name: Write manifest and checksums
        run: node scripts/release/make-manifest.mjs dist out "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.AppImage dist/*.exe dist/*.dmg out/latest.json out/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "OxiTide Electron ${GITHUB_REF_NAME#electron-v}" \
            --generate-notes
