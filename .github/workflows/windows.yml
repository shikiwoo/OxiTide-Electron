name: Windows installer

# Builds the fork's UI in the regular Tauri shell for Windows (WebView2 is
# Chromium, so the Electron shell, which is Unix-only, isn't needed there).
# The updater checks this repository's releases (tauri.conf.json) and only
# accepts installers signed with the fork's key: the build signs the NSIS
# installer with the TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) secrets
# (tauri.release.conf.json turns the .sig on).
# Manual runs leave the installer and its .sig as a workflow artifact;
# appimage.yml calls this for an electron-v* tag and attaches them to the
# release, with latest.json.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read the pinned toolchain
        id: rust
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)".*/\1/p' rust-toolchain.toml | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm --prefix ui ci

      - name: Build the installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm --prefix ui run app:build -- --config crates/oxitide-app/tauri.release.conf.json --bundles nsis

      - uses: actions/upload-artifact@v7
        with:
          name: OxiTide-windows-nsis
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
